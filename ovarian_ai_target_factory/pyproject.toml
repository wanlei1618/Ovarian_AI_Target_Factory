[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ovarian-ai-target-factory"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]
